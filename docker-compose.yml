name: doldol

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-doldol}
      POSTGRES_USER: ${DB_USERNAME:-doldol}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doldol}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    image: doldol-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-doldol}
      DB_USERNAME: ${DB_USERNAME:-doldol}
      DB_PASSWORD: ${DB_PASSWORD:-doldol}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 설정하세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
    expose:
      - "8080"

  frontend:
    # FE 저장소(doldolred/FE)를 이 폴더 옆에 clone 해 둔다: ../FE
    build: ../FE
    image: doldol-web:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db-data:
