name: doldol

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-doldol}
      POSTGRES_USER: ${DB_USERNAME:-doldol}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-doldol}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    image: doldol-api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-doldol}
      DB_USERNAME: ${DB_USERNAME:-doldol}
      DB_PASSWORD: ${DB_PASSWORD:-doldol}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 설정하세요}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-nicepay}
      FRONTEND_URL: ${FRONTEND_URL:-}
      PAYMENT_PENDING_TIMEOUT: ${PAYMENT_PENDING_TIMEOUT:-PT30M}
      NICEPAY_CLIENT_ID: ${NICEPAY_CLIENT_ID:-}
      NICEPAY_SECRET_KEY: ${NICEPAY_SECRET_KEY:-}
      NICEPAY_API_URL: ${NICEPAY_API_URL:-https://sandbox-api.nicepay.co.kr}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID:-}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY:-}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET:-}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET:-}
      # 메일 (비밀번호 찾기) — 비우면 보내지 않고 로그에만
      SPRING_MAIL_HOST: ${MAIL_HOST:-}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-DOLDOL <no-reply@doldol.co.kr>}
      # 서버를 켤 때 관리자로 바꿀 회원 이메일 (쉼표로 여러 개, 먼저 가입해 둘 것)
      INITIAL_ADMIN_EMAILS: ${INITIAL_ADMIN_EMAILS:-}
      UPLOAD_DIR: /app/uploads
      SHIPPING_BASE_FEE: ${SHIPPING_BASE_FEE:-3000}
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-50000}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  frontend:
    # FE 저장소(doldolred/FE)를 이 폴더 옆에 clone 해 둔다: ../FE
    build:
      context: ../FE
      # FE 는 빌드할 때 결제 공개 키가 들어간다 (비밀 키는 넣지 않는다)
      args:
        VITE_PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-nicepay}
        VITE_NICEPAY_CLIENT_ID: ${NICEPAY_CLIENT_ID:-}
        VITE_PORTONE_STORE_ID: ${PORTONE_STORE_ID:-}
        VITE_PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY:-}
    image: doldol-web:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db-data:
  uploads:
