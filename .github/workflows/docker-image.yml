# main 에 push 되면 테스트 후 API 이미지를 GHCR 에 올린다 → 서버에서 deploy/deploy.sh 로 받는다
name: docker-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/doldolred/be

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Testcontainers 로 실제 Postgres 를 띄워 테스트 (러너에 docker 가 있다)
      - name: Test
        run: chmod +x gradlew && ./gradlew --no-daemon test   # Windows 에서 올려 실행 권한이 빠져 있다

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
