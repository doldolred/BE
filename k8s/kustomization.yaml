apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: doldol

resources:
  - namespace.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  # secret.example.yaml 을 secret.yaml 로 복사해 값 채운 뒤 주석 해제 (secret.yaml 은 gitignore)
  # - secret.yaml

# 레지스트리 확정 후 newName/newTag 만 바꾸면 됨
images:
  - name: doldol-api
    newName: doldol-api
    newTag: local
  - name: doldol-web
    newName: doldol-web
    newTag: local
