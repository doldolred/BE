# k3s 기본 Ingress 컨트롤러(Traefik) 기준. 도메인 확정 후 host + TLS 추가
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: doldol
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
