spring:
  application:
    name: doldol-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/doldol}
    username: ${DB_USERNAME:doldol}
    password: ${DB_PASSWORD:doldol}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # 목록에서 연관 데이터(주문 상품 · 회원)를 한 건씩이 아니라 최대 100건씩 묶어서 조회 (N+1 방지)
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 상품 이미지 1장 5MB 까지 (ImageStorage 에서 한 번 더 확인)
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    # 메일 서버는 환경변수로: SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
    # (AWS SES 예: email-smtp.ap-northeast-2.amazonaws.com, 587). 호스트가 없으면 메일 대신 로그에 남긴다
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # HS256 서명용, 32바이트 이상. 운영에서는 반드시 JWT_SECRET 환경변수로 교체
    secret: ${JWT_SECRET:local-dev-secret-key-change-me-0123456789abcdef}
    # 짧게 — 만료되면 FE 가 리프레시 쿠키로 새로 받는다
    access-token-validity: ${JWT_ACCESS_VALIDITY:PT30M}
    # 로그인 유지 기간
    refresh-token-validity: ${JWT_REFRESH_VALIDITY:P14D}
    # 리프레시 쿠키를 https 에서만 — 운영 true, 로컬 http 개발 false
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
  # 메일 속 링크(비밀번호 재설정)가 가리킬 사이트 주소
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:DOLDOL <no-reply@doldol.co.kr>}
  admin:
    # 서버를 켤 때 관리자로 바꿀 회원 이메일 (쉼표로 여러 개). 먼저 사이트에서 가입해 둘 것
    initial-emails: ${INITIAL_ADMIN_EMAILS:}
  upload:
    # 상품 이미지 저장 폴더 (운영: 도커 볼륨 /app/uploads)
    dir: ${UPLOAD_DIR:./uploads}
  shipping:
    # 기본 배송비, 상품 금액이 free-threshold 이상이면 무료. 제주 · 도서 추가 배송비는 관리자 화면(배송 지역)에서
    base-fee: ${SHIPPING_BASE_FEE:3000}
    free-threshold: ${SHIPPING_FREE_THRESHOLD:50000}
  payment:
    # nicepay: 나이스페이 START 직접 연동 / portone: 포트원 경유(정산 때 나이스페이먼츠로 갈아탈 때)
    provider: ${PAYMENT_PROVIDER:nicepay}
    # 결제 후 돌려보낼 FE 주소. 비우면 같은 도메인 기준 상대 경로(/mypage/orders/...)로 보낸다
    frontend-url: ${FRONTEND_URL:}
    # 결제하지 않은 주문을 자동 취소하고 재고를 돌려놓기까지의 시간
    pending-timeout: ${PAYMENT_PENDING_TIMEOUT:PT30M}
    # 자동 취소 대상을 확인하는 주기
    expire-check-interval: ${PAYMENT_EXPIRE_CHECK_INTERVAL:PT1M}
    nicepay:
      client-id: ${NICEPAY_CLIENT_ID:}
      secret-key: ${NICEPAY_SECRET_KEY:}
      # 운영: https://api.nicepay.co.kr
      api-url: ${NICEPAY_API_URL:https://sandbox-api.nicepay.co.kr}
    portone:
      store-id: ${PORTONE_STORE_ID:}
      channel-key: ${PORTONE_CHANNEL_KEY:}
      api-secret: ${PORTONE_API_SECRET:}
      webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
      api-url: ${PORTONE_API_URL:https://api.portone.io}

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
server:
  # edge(nginx) 뒤에서 돈다 — X-Forwarded-For · Proto 로 실제 접속 IP 와 https 를 인식
  forward-headers-strategy: native
logging:
  level:
    root: INFO
